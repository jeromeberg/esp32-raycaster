[platformio]
default_envs = nodemcu-32s

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
lib_deps =
	olikraus/U8g2 @ ^2.36.18

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
	+<map.cpp>
	+<movement.cpp>
	+<raycaster.cpp>
	+<renderer.cpp>

