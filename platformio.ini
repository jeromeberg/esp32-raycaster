[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	olikraus/U8g2 @ ^2.36.18

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
	+<map.cpp>
	+<movement.cpp>
	+<raycaster.cpp>
	+<renderer.cpp>

